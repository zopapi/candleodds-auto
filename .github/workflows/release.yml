# Builds ghcr.io/zopapi/candleodds-auto:<tag> when a release tag vX.Y.Z is pushed. Never overwrites an existing version:
# the Railway template and every member's deployment pin a version, so a published version must never change.
name: release image
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: tag must match package.json
        run: test "v$(node -p 'require("./package.json").version')" = "${{ github.ref_name }}"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: refuse to overwrite a published version
        run: |
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then echo "$IMAGE already exists"; exit 1; fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          provenance: true
      - name: image digest
        run: docker buildx imagetools inspect "$IMAGE" | tee -a "$GITHUB_STEP_SUMMARY"
